<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Obsidian</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 40px 16px; text-align: center; background: Canvas; color: CanvasText; }
  a.btn { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 10px; background: #7c3aed; color: #fff; text-decoration: none; font-weight: 600; }
  p.small { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
  <h1 id="title">Returning to Obsidian…</h1>
  <p id="msg">If Obsidian does not open by itself, tap the button.</p>
  <a class="btn" id="go" href="#">Open Obsidian</a>
  <p class="small">This page only passes Google's one-time sign-in code to the Drive Vault Sync plugin. It stores nothing and sends nothing anywhere else.</p>
<script>
  // Forward ?code=...&state=... (or ?error=...) to the plugin's obsidian:// handler.
  var target = "obsidian://drive-vault-sync-auth" + window.location.search;
  document.getElementById("go").href = target;
  if (new URLSearchParams(window.location.search).has("error")) {
    document.getElementById("title").textContent = "Sign-in was cancelled";
  }
  window.location.replace(target);
</script>
</body>
</html>
